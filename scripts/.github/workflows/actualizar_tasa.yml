name: Actualizar Tasa BCV Oficial

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 21:00 UTC (5:00 PM hora Venezuela)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

permissions:
  contents: write # Permiso para guardar cambios en el repositorio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install beautifulsoup4 urllib3

      - name: Ejecutar scraper
        run: python scripts/actualizar_bcv.py

      - name: Hacer commit y push del JSON actualizado
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add tasa.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tasa BCV" && git push)
